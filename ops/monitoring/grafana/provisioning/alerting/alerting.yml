# Grafana-managed alerts for itlearning.tech. Each rule runs an instant Prometheus query (A) and a
# threshold (C); a separate alert fires for each series (each server, site or mail port).
apiVersion: 1

# The contact point and notification policy are generated from /opt/monitoring/.env by
# setup-monitoring.sh (contactpoints.yml), so extra addresses and the Telegram token stay on the server.

groups:
  - orgId: 1
    name: itlearning
    folder: ITLearning
    interval: 1m
    rules:
      - uid: itl-target-down
        title: Monitoring target down
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "Prometheus can't scrape {{ $labels.job }} on {{ $labels.instance }}."
          description: "The server or its exporter is down or unreachable (for the Jobe VPS: Caddy, node-exporter or the network)."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: up, instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [1]}}]}

      - uid: itl-site-down
        title: Website down
        condition: C
        for: 3m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }} is not answering with HTTP 200."
          description: "Checked from the Moodle server every 30 s. For the Jobe URL, learners can't check code answers until it's back."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'probe_success{job="blackbox-http"}', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [1]}}]}

      - uid: itl-mail-port-down
        title: Mail port down
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Can't connect to {{ $labels.instance }}."
          description: "Moodle notifications and MFA email codes depend on the mail server."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'probe_success{job="blackbox-tcp"}', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [1]}}]}

      - uid: itl-cert-expiry
        title: TLS certificate expires soon
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "The certificate for {{ $labels.instance }} expires in {{ humanize $values.A.Value }} days."
          description: "Renewal should happen automatically about 30 days before expiry; check Nginx Proxy Manager (itlearning.tech) or Caddy (jobe.itlearning.tech)."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: '(probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) / 86400', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [14]}}]}

      - uid: itl-disk-full
        title: Disk almost full
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }}: the root disk is {{ humanize $values.A.Value }}% full."
          description: "Check Docker images (docker system df), backups in /root/backups and Prometheus data."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: '100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [85]}}]}

      - uid: itl-memory-high
        title: Memory almost exhausted
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }}: {{ humanize $values.A.Value }}% of memory in use."
          description: "On the Moodle server, a loaded Ollama model is the usual cause; see the container panels."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: '100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [90]}}]}

      # p90 rules (28 October 2026). Latency rules need a minimum of traffic, so a single slow request
      # at night can't fire them.
      - uid: itl-cpu-high
        title: CPU busy (p90 over 1 h)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }}: p90 CPU use over the last hour is {{ humanize $values.A.Value }}%."
          description: "Sustained load rather than a spike. On the Jobe VPS: heavy quiz use or abusive submissions."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 3900, to: 0}
            model: {refId: A, expr: 'quantile_over_time(0.9, (100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))))[1h:1m])', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [85]}}]}

      - uid: itl-memory-p90
        title: Memory under sustained pressure (p90 over 1 h)
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }}: p90 memory use over the last hour is {{ humanize $values.A.Value }}%."
          description: "Memory has stayed high for an hour. On the Moodle server, check whether an Ollama model stays loaded."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 3900, to: 0}
            model: {refId: A, expr: 'quantile_over_time(0.9, (100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))[1h:1m])', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [85]}}]}

      - uid: itl-moodle-pages-slow
        title: Moodle page loads slow (p90)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "p90 page load time on itlearning.tech is {{ humanize $values.A.Value }} s (last 15 min)."
          description: "Real learner requests for PHP pages, measured at Nginx Proxy Manager; static files, AJAX and quiz submissions are excluded. Check the database and Moodle container CPU."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {refId: A, expr: 'histogram_quantile(0.9, sum by (le) (rate(moodle_http_response_time_seconds_hist_bucket{kind="page"}[15m]))) and on() (sum(increase(moodle_http_response_time_seconds_hist_count{kind="page"}[15m])) >= 20)', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [2]}}]}

      - uid: itl-code-checks-slow
        title: Code checks slow (p90)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "p90 time for Jobe to grade a code check is {{ humanize $values.A.Value }} s or more (last 15 min)."
          description: "Measured at Caddy on the Jobe VPS. Caddy's largest timing bucket is 10 s, so 10 means 10 s or more. Usually many learners checking at once; see the Jobe VPS CPU."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {refId: A, expr: 'histogram_quantile(0.9, sum by (le) (rate(caddy_http_request_duration_seconds_bucket{instance="jobe-vps", method="POST"}[15m]))) and on() (sum(increase(caddy_http_request_duration_seconds_count{instance="jobe-vps", method="POST"}[15m])) >= 5)', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [9.99]}}]}

      - uid: itl-site-checks-slow
        title: Website checks slow (p90 over 30 min)
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "p90 response time of {{ $labels.instance }} from the outside check is {{ humanize $values.A.Value }} s."
          description: "From the blackbox check every 30 s on the Moodle server."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 1800, to: 0}
            model: {refId: A, expr: 'quantile_over_time(0.9, probe_duration_seconds{job="blackbox-http"}[30m])', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [3]}}]}

      - uid: itl-moodle-5xx
        title: Moodle error rate high
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "{{ humanize $values.A.Value }}% of itlearning.tech requests failed with a 5xx error (last 10 min)."
          description: "PHP, database or Moodle errors while the login page may still load. Check docker logs moodle and the database."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {refId: A, expr: '100 * sum(rate(moodle_http_response_count_total{status=~"5.."}[10m])) / sum(rate(moodle_http_response_count_total[10m])) and on() (sum(increase(moodle_http_response_count_total[10m])) >= 50)', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [2]}}]}

      - uid: itl-jobe-5xx
        title: Jobe errors or overload
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Jobe returned {{ humanize $values.A.Value }} 5xx responses in the last 5 min."
          description: "Learners' Checks fail. A 503 usually means all Jobe workers are busy; other 5xx errors mean Jobe or Apache in its container is failing."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'sum(increase(caddy_http_request_duration_seconds_count{instance="jobe-vps", code=~"5.."}[5m]))', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0.5]}}]}

      - uid: itl-disk-trend
        title: Disk will fill within 7 days
        condition: C
        for: 1h
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.instance }}: at the growth rate of the last 6 h, the root disk fills within 7 days."
          description: "Earlier warning than 'Disk almost full'. Look for growing logs, Docker images or backups."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 21600, to: 0}
            model: {refId: A, expr: 'predict_linear(node_filesystem_avail_bytes{mountpoint="/"}[6h], 7 * 86400)', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [0]}}]}

      - uid: itl-container-restart
        title: Container restarted
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "Container {{ $labels.name }} on the Moodle server (re)started {{ humanize $values.A.Value }} s ago."
          description: "Expected after a deployment; otherwise check docker logs for a crash. The monitoring containers are excluded."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {refId: A, expr: 'time() - max by (name) (container_start_time_seconds{name!="", name!~"prometheus|grafana|cadvisor|node-exporter|blackbox|nginxlog|mysqld-exporter"})', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [900]}}]}

      - uid: itl-container-oom
        title: Container ran out of memory
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "Container {{ $labels.name }} on the Moodle server was killed for running out of memory."
          description: "Raise its memory limit or find what grew (Moodle PHP workers, MariaDB buffers or an Ollama model)."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {refId: A, expr: 'sum by (name) (increase(container_oom_events_total{name!=""}[15m]))', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}

      - uid: itl-collector-stale
        title: Monitoring collector not running
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "The itl-collect timer last wrote metrics {{ humanize $values.A.Value }} s ago."
          description: "Cron, mail-queue and backup checks are blind until it runs again: systemctl status itl-collect.timer"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'time() - itl_collector_last_run_timestamp_seconds', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [300]}}]}
      - uid: itl-moodle-cron
        title: Moodle cron stalled
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "No Moodle scheduled task has started for {{ humanize $values.A.Value }} s."
          description: "Cron sends emails and issues completions and certificates. Check the moodle-cron container: docker logs moodle-cron"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'time() - itl_moodle_cron_last_task_start_timestamp_seconds', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [900]}}]}
      - uid: itl-moodle-tasks-failing
        title: Moodle scheduled tasks failing
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ humanize $values.A.Value }} Moodle scheduled task(s) are failing and being retried."
          description: "See Site administration → Server → Tasks → Scheduled tasks (a fail delay above 0)."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'itl_moodle_scheduled_tasks_failing', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}
      - uid: itl-mail-queue
        title: Mail queue backlog
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ humanize $values.A.Value }} emails are waiting in the mail queue."
          description: "Notifications and MFA email codes are delayed. Check docker logs mailserver and postqueue -p."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'itl_mail_queue_messages', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [20]}}]}
      - uid: itl-mail-queue-age
        title: Mail stuck in the queue
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "The oldest queued email has waited {{ humanize $values.A.Value }} s."
          description: "MFA email codes expire; check docker logs mailserver for deferred deliveries."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'itl_mail_queue_oldest_age_seconds', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [900]}}]}
      - uid: itl-backup-stale
        title: Backup missing or old
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "The newest successful backup is {{ humanize $values.A.Value }} hours old."
          description: "The nightly backup (itl-backup.timer, 01:30 UTC) did not succeed. Check: journalctl -u itl-backup"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: '(time() - itl_backup_last_success_timestamp_seconds) / 3600', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [26]}}]}
      - uid: itl-backup-failed
        title: Backup failed
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "The last backup run failed (exit code {{ $values.A.Value }})."
          description: "Check: journalctl -u itl-backup"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'itl_backup_last_exit_code', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [0]}}]}
      - uid: itl-db-down
        title: Database down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "mysqld-exporter can't reach MariaDB (moodle-db)."
          description: "Moodle is down or failing. Check docker logs moodle-db."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: 'mysql_up', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: lt, params: [1]}}]}

      - uid: itl-db-connections
        title: Database connections near the limit
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "MariaDB is using {{ humanize $values.A.Value }}% of its connections."
          description: "The limit is set by --max-connections in the itlearning-tech compose file. Raise it, or look for stuck PHP requests."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {refId: A, expr: '100 * mysql_global_status_threads_connected / mysql_global_variables_max_connections', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [80]}}]}

      - uid: itl-db-slow-queries
        title: Database slow queries
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ humanize $values.A.Value }} queries ran longer than the slow-query threshold in the last 15 min."
          description: "Usually a missing index or a heavy report. Enable the slow query log to see which."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {refId: A, expr: 'increase(mysql_global_status_slow_queries[15m])', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [5]}}]}

      - uid: itl-db-aborted
        title: Database connection errors
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning}
        annotations:
          summary: "{{ humanize $values.A.Value }} aborted connection attempts in the last 15 min."
          description: "Failed logins or network errors to MariaDB."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {refId: A, expr: 'increase(mysql_global_status_aborted_connects[15m])', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [10]}}]}

      - uid: itl-backup-offsite-stale
        title: Off-site backup missing or old
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: critical}
        annotations:
          summary: "The newest off-site backup copy is {{ humanize $values.A.Value }} hours old."
          description: "The encrypted copy to the Jobe VPS did not succeed after the nightly backup. Check: journalctl -u itl-backup"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {refId: A, expr: '(time() - itl_backup_offsite_last_success_timestamp_seconds) / 3600', instant: true}
          - refId: C
            datasourceUid: __expr__
            model: {refId: C, type: threshold, expression: A, conditions: [{evaluator: {type: gt, params: [26]}}]}
