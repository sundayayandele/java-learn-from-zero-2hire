# ITLearning monitoring (ops/monitoring): a response-time log for itlearning.tech requests only.
# Nginx Proxy Manager includes this file in its http block; setup-monitoring.sh installs it.
map $host $itl_timing {
    itlearning.tech     1;
    www.itlearning.tech 1;
    default             0;
}

# The kind of request, so page loads aren't averaged with static files or with quiz submissions
# (a CodeRunner Check posts to processattempt.php and waits for Jobe).
map $uri $itl_kind {
    ~^/mod/quiz/processattempt\.php                                          quizsubmit;
    ~^/lib/ajax/                                                              ajax;
    ~^/(theme/|lib/javascript\.php|lib/requirejs\.php|lib/yui|lib/fonts/|pluginfile\.php|draftfile\.php|webservice/pluginfile\.php|favicon) asset;
    default                                                                   page;
}

log_format itl_timing '$time_iso8601 $status $request_method $itl_kind $request_time $upstream_response_time';
