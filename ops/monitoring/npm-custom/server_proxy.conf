# ITLearning: included in every proxy host's server block; installed by ops/monitoring/setup-monitoring.sh.

# Monitoring: a response-time log for itlearning.tech requests only ($itl_timing, see http_top.conf).
# The *_access.log name makes Nginx Proxy Manager's own logrotate rotate it weekly.
access_log /data/logs/itl-timing_access.log itl_timing if=$itl_timing;

# Security: server admin tools are not served publicly. Portainer controls Docker (root on this
# server) and the mail GUI manages mailboxes; reach them through SSH tunnels instead
# (ops/monitoring/README.md, "Server admin tools").
if ($host ~* "^(portainer|mailgui)\.itlearning\.tech$") {
    return 403;
}
