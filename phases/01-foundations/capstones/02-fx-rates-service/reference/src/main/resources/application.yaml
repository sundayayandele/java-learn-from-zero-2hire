spring:
  application:
    name: fx-rates-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  cache:
    cache-names: ratesPerEur,publicationDates
    caffeine:
      spec: maximumSize=50000,expireAfterWrite=24h,recordStats

fx:
  ecb-history-url: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist.zip
  publication-zone: Europe/Berlin
  max-days-after-latest: 7
  import:
    schedule-enabled: ${FX_IMPORT_SCHEDULE_ENABLED:true}
    # Weekdays at 16:45 CET/CEST, after the ECB publishes (around 16:00).
    cron: "0 45 16 * * MON-FRI"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
    heapdump:
      access: none
  metrics:
    tags:
      application: ${spring.application.name}

server:
  shutdown: graceful
