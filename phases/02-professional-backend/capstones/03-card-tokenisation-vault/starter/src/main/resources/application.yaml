spring:
  application:
    name: card-tokenisation-vault
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm from compose.yaml locally; your identity provider's issuer in production.
          issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8081/realms/itl}
          audiences: ${OAUTH_AUDIENCE:itl-api}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
    heapdump:
      access: none
  metrics:
    tags:
      application: ${spring.application.name}

server:
  shutdown: graceful
