apiVersion: apps/v1
kind: Deployment
metadata:
  name: sec-financials-graphql
spec:
  replicas: 1
  selector:
    matchLabels: {}
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: sec-financials-graphql:latest      # replaced per overlay (kustomize images)
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OAUTH_ISSUER_URI                                 # your identity provider's realm/tenant issuer
              value: https://auth.example.com/realms/itl
          envFrom:
            - secretRef:
                name: sec-financials-graphql-db      # DB_URL, DB_USER, DB_PASSWORD; never committed for real environments
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
