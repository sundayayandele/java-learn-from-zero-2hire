# Local cluster (kind or minikube) with an in-cluster PostgreSQL. For learning only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sec-financials-graphql
resources:
  - namespace.yaml
  - ../../base
  - postgres.yaml
images:
  - name: sec-financials-graphql
    newName: ghcr.io/OWNER/sec-financials-graphql   # your image; CI or Argo CD Image Updater changes the tag
    newTag: latest
secretGenerator:
  # Local-cluster-only credentials, like .env.example. Real environments use External Secrets or Sealed Secrets.
  - name: sec-financials-graphql-db
    literals:
      - DB_URL=jdbc:postgresql://postgres:5432/app
      - DB_USER=app
      - DB_PASSWORD=local-cluster-only
