# Local stack: `docker compose up --build`. Credentials come from .env (copy .env.example; never commit .env).
# Keycloak (http://localhost:8081, realm "itl") issues the JWTs the API accepts.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm", "--http-port=8081", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Tokens must carry the same issuer whether fetched from the host or from inside the network.
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Simulated payment providers for manual testing (the tests start their own WireMock servers).
  provider-a:
    image: wiremock/wiremock:3.13.2
    command: ["--global-response-templating"]
    volumes:
      - ./wiremock:/home/wiremock:ro
    ports:
      - "9091:8080"

  provider-b:
    image: wiremock/wiremock:3.13.2
    command: ["--global-response-templating"]
    volumes:
      - ./wiremock:/home/wiremock:ro
    ports:
      - "9092:8080"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/app
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      OAUTH_ISSUER_URI: http://localhost:8081/realms/itl
      # Inside the network the issuer is reached at keycloak:8081; the token's iss claim still says localhost.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8081/realms/itl/protocol/openid-connect/certs
      PROVIDER_A_URL: http://provider-a:8080
      PROVIDER_A_SECRET: ${PROVIDER_A_SECRET:?set PROVIDER_A_SECRET in .env}
      PROVIDER_B_URL: http://provider-b:8080
      PROVIDER_B_SECRET: ${PROVIDER_B_SECRET:?set PROVIDER_B_SECRET in .env}
    ports:
      - "8080:8080"

volumes:
  pgdata:
