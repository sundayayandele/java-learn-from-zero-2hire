spring:
  application:
    name: payment-gateway-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD}
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm from compose.yaml locally; your identity provider's issuer in production.
          issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:8081/realms/itl}
          audiences: ${OAUTH_AUDIENCE:itl-api}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
    heapdump:
      access: none
  metrics:
    tags:
      application: ${spring.application.name}

server:
  shutdown: graceful

# Payment providers and resilience settings (GatewayProperties). Secrets only from the environment.
gateway:
  callback-url: ${GATEWAY_CALLBACK_URL:http://localhost:8080/payment-complete}
  connect-timeout: 2s
  read-timeout: 5s
  pending-verify-after: 15m
  abandon-after: 24h
  idempotency-ttl: 24h
  reconcile-every: 5m
  circuit-breaker:
    sliding-window-size: 10
    minimum-number-of-calls: 5
    failure-rate-threshold: 50
    open-for: 30s
  verify-retry:
    max-retries: 2
    delay: 200ms
    multiplier: 2.0
    jitter: 50ms
  providers:
    - name: provider-a
      base-url: ${PROVIDER_A_URL:http://localhost:9091}
      secret: ${PROVIDER_A_SECRET:}
      priority: 1
      currencies: [NGN, GHS, KES, USD]
    - name: provider-b
      base-url: ${PROVIDER_B_URL:http://localhost:9092}
      secret: ${PROVIDER_B_SECRET:}
      priority: 2
      currencies: [NGN, GHS, USD]
  limits:
    NGN: 1000000000
    GHS: 10000000
    KES: 100000000
    USD: 1000000
