# Checks for this repository itself: content consistency, and every Java project builds and passes its tests.
name: repo-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Generated files, starters, quizzes, videos schema, relative links
        run: python scripts/check_repo.py
      - name: Videos still online and embeddable
        run: python lms/check_videos.py --quick

  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - templates/spring-boot-service-starter
          - templates/spring-boot-secure-service-starter
          - templates/java-cli-starter
          - phases/01-foundations/capstones/06-sanctions-screening-service/starter
          - phases/02-professional-backend/capstones/03-card-tokenisation-vault/starter
          - labs/04-boot3-to-4-upgrade
          - labs/08-broken-pipeline-and-container/app
          - templates/itl-pay-starter
        include:
          # The practice tracks are graded against their reference solutions; learners' stubs fail by design.
          - project: practice/dsa
            args: -Psolutions
          - project: practice/sql
            args: -Psolutions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml
      - name: Build and test ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: ./mvnw -B verify ${{ matrix.args }}

  # The course targets Java 21; the starters and the practice track must also build on Java 25, the current LTS (review item 17).
  java25:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - templates/spring-boot-service-starter
          - templates/spring-boot-secure-service-starter
          - templates/java-cli-starter
        include:
          - project: practice/dsa
            args: -Psolutions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml
      - name: Build and test ${{ matrix.project }} on Java 25
        working-directory: ${{ matrix.project }}
        run: ./mvnw -B verify ${{ matrix.args }}

  deploy:
    # The ITL Pay starter's Kubernetes and cloud files (Module 12): chart renders for every environment, Terraform is valid
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/itl-pay-starter/deploy
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - name: Helm chart lints and renders with local and AWS values
        run: |
          for env in local aws; do
            helm lint helm/itl-pay -f helm/itl-pay/values-$env.yaml
            helm template itl-pay helm/itl-pay -f helm/itl-pay/values-$env.yaml > /dev/null
          done
      - name: Terraform is formatted and valid
        working-directory: templates/itl-pay-starter/deploy/terraform/aws
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
