server.port=8085
spring.application.name=rates
# R2DBC for the application, JDBC only for Flyway's migrations at start-up
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:rates}
spring.r2dbc.username=${DB_USER:rates}
spring.r2dbc.password=${DB_PASSWORD:rates}
spring.r2dbc.pool.max-size=20
spring.flyway.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:rates}
spring.flyway.user=${DB_USER:rates}
spring.flyway.password=${DB_PASSWORD:rates}
# The FX provider this service quotes from (topic 14.1); in Compose, a second rates container plays the provider
provider.url=${PROVIDER_URL:http://localhost:8085}
provider.delay-ms=${PROVIDER_DELAY_MS:100}
rates.tick-ms=500
# Observability (Module 13)
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.enabled=false
management.endpoints.web.exposure.include=health,prometheus
