server.port=8086
spring.application.name=rates-mvc
# Every request on its own virtual thread (topic 14.3). Set to false to compare with Tomcat's 200 platform threads.
spring.threads.virtual.enabled=true
# Reads the same rates database as the reactive service; the schema belongs to rates (it runs the migrations)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:rates}
spring.datasource.username=${DB_USER:rates}
spring.datasource.password=${DB_PASSWORD:rates}
spring.datasource.hikari.maximum-pool-size=20
provider.url=${PROVIDER_URL:http://localhost:8085}
provider.delay-ms=${PROVIDER_DELAY_MS:100}
management.endpoints.web.exposure.include=health,prometheus
