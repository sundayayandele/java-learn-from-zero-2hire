server:
  port: 8080
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: accounts
              uri: ${ACCOUNTS_URL:http://localhost:8081}
              predicates:
                - Path=/api/accounts/**
              filters:
                - StripPrefix=1
            - id: transfers
              uri: ${TRANSFERS_URL:http://localhost:8082}
              predicates:
                - Path=/api/transfers/**
              filters:
                - StripPrefix=1
                - AddRequestHeader=X-Gateway, itl-pay
            - id: rates
              uri: ${RATES_URL:http://localhost:8085}
              predicates:
                - Path=/api/rates/**,/api/quotes/**
              filters:
                - StripPrefix=1
            - id: assistant
              uri: ${ASSISTANT_URL:http://localhost:8087}
              predicates:
                - Path=/api/assistant/**
              filters:
                - StripPrefix=1
# Observability (Module 13): traces to the OpenTelemetry collector, metrics scraped by Prometheus
management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    resource-attributes:
      deployment.environment.name: ${ENVIRONMENT:local}
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
