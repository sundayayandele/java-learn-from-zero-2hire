server.port=8082
spring.application.name=transfers
accounts.url=${ACCOUNTS_URL:http://localhost:8081}
resilience4j.circuitbreaker.instances.accounts.sliding-window-size=10
resilience4j.circuitbreaker.instances.accounts.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accounts.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accounts.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.accounts.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
resilience4j.timelimiter.instances.accounts.timeout-duration=3s
management.endpoints.web.exposure.include=health,circuitbreakers,prometheus
management.health.circuitbreakers.enabled=true
# v0.2: its own database, and Kafka for events
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transfers}
spring.datasource.username=${DB_USER:transfers}
spring.datasource.password=${DB_PASSWORD:transfers}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.consumer.auto-offset-reset=earliest
outbox.poll-ms=500
# v0.4: Redis caches the transfer status that mobile apps poll (topic 13.4)
spring.data.redis.host=${REDIS_HOST:localhost}
# Fail fast when Redis is unavailable, then fall back to the database (Lettuce would otherwise wait 60 s)
spring.data.redis.timeout=250ms
spring.data.redis.connect-timeout=250ms
# Observability (Module 13): traces to the OpenTelemetry collector, metrics scraped by Prometheus
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.opentelemetry.resource-attributes.deployment.environment.name=${ENVIRONMENT:local}
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
