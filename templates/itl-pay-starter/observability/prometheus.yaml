# Replaces otel-lgtm's Prometheus config: scrape every ITL Pay service (pull), and keep the OTLP receiver (push).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes: [service.name, service.instance.id, deployment.environment.name]

rule_files:
  - /otel-lgtm/itl-pay-alerts.yaml

scrape_configs:
  - job_name: itl-pay
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway:8080, accounts:8081, transfers:8082, fraud:8083, notifications:8084, rates:8085]
    relabel_configs:
      - source_labels: [__address__]        # gateway:8080 -> service="gateway"
        regex: "([^:]+):.*"
        target_label: service
