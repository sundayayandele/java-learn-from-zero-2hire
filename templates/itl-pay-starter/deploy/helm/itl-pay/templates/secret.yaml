{{- if .Values.databases.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.databases.secretName }}
  labels:
    {{- include "itl-pay.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $db, $password := .Values.databases.passwords }}
  {{ $db }}: {{ $password | quote }}
  {{- end }}
{{- end }}
