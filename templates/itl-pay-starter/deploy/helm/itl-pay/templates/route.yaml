{{- if .Values.route.enabled }}
# Routes outside traffic to the ITL Pay gateway through a Gateway API Gateway (topic 12.1).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: itl-pay
  labels:
    {{- include "itl-pay.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gatewayName }}
      {{- with .Values.route.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
  {{- with .Values.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: gateway
          port: {{ .Values.services.gateway.port }}
{{- end }}
