# Local PostgreSQL for kind (topic 12.1). In the cloud this is Amazon RDS (topic 12.4), not a pod.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin
type: Opaque
stringData:
  password: postgres                       # development only: real passwords come from a secrets manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sql: |
    CREATE USER transfers WITH PASSWORD 'transfers';
    CREATE DATABASE transfers OWNER transfers;
    CREATE USER notifications WITH PASSWORD 'notifications';
    CREATE DATABASE notifications OWNER notifications;
    CREATE USER interest WITH PASSWORD 'interest';
    CREATE DATABASE interest OWNER interest;
    CREATE USER rates WITH PASSWORD 'rates';
    CREATE DATABASE rates OWNER rates;
    CREATE USER assistant WITH PASSWORD 'assistant';
    CREATE DATABASE assistant OWNER assistant;
    \connect assistant
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS hstore;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet                          # a stable name and its own volume, unlike a Deployment's pods
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.1-pg18-trixie   # PostgreSQL 18 with pgvector (topic 15.2)
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-admin, key: password } }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
