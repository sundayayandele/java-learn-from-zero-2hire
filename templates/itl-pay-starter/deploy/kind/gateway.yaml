# The cluster's front door on kind (topic 12.1): Envoy Gateway implements the Gateway API.
# Install it first: helm install eg oci://docker.io/envoyproxy/gateway-helm --version 1.9.3 -n envoy-gateway-system --create-namespace
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: itl-pay
  namespace: itl-pay
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
