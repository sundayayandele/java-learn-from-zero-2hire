server.port=8087
spring.application.name=assistant
spring.threads.virtual.enabled=true
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/assistant}
spring.datasource.username=${DB_USER:assistant}
spring.datasource.password=${DB_PASSWORD:assistant}
spring.sql.init.mode=always
# The model (topic 15.1): Ollama on your machine by default. Both models must be pulled first:
#   ollama pull qwen3:4b-instruct && ollama pull nomic-embed-text
# On an 8 GB machine use CHAT_MODEL=qwen3:1.7b: faster, but it failed every tool question in the evaluation (15.4)
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${CHAT_MODEL:qwen3:4b-instruct}
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.chat.num-predict=400
spring.ai.ollama.chat.think=false
# Without a read timeout nothing bounds a slow model call (topic 15.4). 90 s suits a laptop CPU; a GPU or hosted model needs far less
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=90s
spring.ai.ollama.embedding.model=nomic-embed-text
# pgvector (topic 15.2): nomic-embed-text gives 768 numbers per text
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW
itlpay.assistant.similarity-threshold=0.55
# MCP server (topic 15.3): streamable HTTP at /mcp, public tools only
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=itl-pay
spring.ai.mcp.server.version=0.6.0
spring.ai.mcp.server.instructions=Public ITL Pay information: exchange rates and the help centre.
# The services the tools read from
itlpay.accounts-url=${ACCOUNTS_URL:http://localhost:8081}
itlpay.transfers-url=${TRANSFERS_URL:http://localhost:8082}
itlpay.rates-url=${RATES_URL:http://localhost:8085}
# Observability (Module 13); Spring AI adds gen_ai.client.* metrics and spans for every model call
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.enabled=false
management.endpoints.web.exposure.include=health,prometheus
