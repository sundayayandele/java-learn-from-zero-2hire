spring.application.name=interest-batch
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/interest}
spring.datasource.username=${DB_USER:interest}
spring.datasource.password=${DB_PASSWORD:interest}
# Spring Batch keeps its job repository (what ran, how far it got) in the same database
spring.batch.jdbc.initialize-schema=always
# Leave empty; the restart lesson sets it to make the job fail part-way through
interest.fail-on-account=
